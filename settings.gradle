pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Strata'
includeBuild('build-logic')

// What developers compile against
include('api')
// What engine adapters implement and drive
include('spi')
// The implementation behind both
include('core')
// Java2D adapter
include('canvas-swing')
