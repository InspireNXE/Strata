# Every property used in a mod metadata file must also be in the expandProps map in
# build-logic/src/main/groovy/strata-java.gradle

# Project
version=0.1.0-SNAPSHOT
group=org.inspirenxe
java_version=25
junit_version=5.12.2

# Minecraft adapter
minecraft_version=26.3
