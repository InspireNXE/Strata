// Every Strata project: the Java of java_version, JUnit, sources jar, shared jar metadata
plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "strata-${project.name}"
}

repositories {
    mavenCentral()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

dependencies {
    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-serial', '-Xlint:-processing', '-Xlint:-classfile',
            // Resources main leaves unnamed with _ are named here, which Java 17 would warn about
            '-Xlint:-try'])
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.withType(Jar).configureEach {
    from(rootProject.files('LICENSE', 'NOTICE')) {
        rename { "${it}_strata" }
    }
    manifest {
        attributes([
                'Implementation-Title'  : base.archivesName.get(),
                'Implementation-Version': project.version,
                'Implementation-Vendor' : vendor
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
