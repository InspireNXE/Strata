// Every Strata project: the Java of java_version, JUnit, sources jar, shared jar metadata, and publishing to Maven Central
plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish'
}

base {
    archivesName = "strata-${project.name}"
}

repositories {
    mavenCentral()
    // Strata's own snapshots, for builds that take Strata from Central instead of a checkout beside them
    maven {
        name = 'CentralSnapshots'
        url = uri('https://central.sonatype.com/repository/maven-snapshots/')
        mavenContent {
            snapshotsOnly()
            includeGroup('org.inspirenxe')
        }
    }
}

// A cached -SNAPSHOT is trusted for a day by default, and CI restores the cache between runs, so a build would keep
// an old Strata snapshot. Check the repository for a newer one on every build.
configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor(0, 'seconds')
}

java {
    // The publishing plugin adds the sources and javadoc jars Central requires
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

dependencies {
    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-serial', '-Xlint:-processing', '-Xlint:-classfile',
            // Resources main leaves unnamed with _ are named here, which Java 17 would warn about
            '-Xlint:-try'])
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.withType(Jar).configureEach {
    from(rootProject.files('LICENSE', 'NOTICE')) {
        rename { "${it}_strata" }
    }
    manifest {
        attributes([
                'Implementation-Title'  : base.archivesName.get(),
                'Implementation-Version': project.version,
                'Implementation-Vendor' : vendor
        ])
    }
}

// Snapshots go to Central's snapshot repository and releases to Central itself. The workflows pass the portal token
// and the signing key as Gradle properties (mavenCentralUsername, mavenCentralPassword, signingInMemoryKey and
// signingInMemoryKeyPassword); snapshots are signed only when a key is given.
mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    pom {
        name = base.archivesName
        description = providers.provider { project.description }
        inceptionYear = '2026'
        url = "https://github.com/InspireNXE/${rootProject.name}"
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'inspirenxe'
                name = 'InspireNXE'
                url = 'https://github.com/InspireNXE'
            }
        }
        scm {
            url = "https://github.com/InspireNXE/${rootProject.name}"
            connection = "scm:git:https://github.com/InspireNXE/${rootProject.name}.git"
            developerConnection = "scm:git:ssh://git@github.com/InspireNXE/${rootProject.name}.git"
        }
    }
}

// The artifact is named after the jar, which a project may rename after applying this plugin
afterEvaluate {
    mavenPublishing.coordinates(project.group.toString(), base.archivesName.get(), project.version.toString())
}
