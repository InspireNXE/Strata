plugins {
    id 'strata-shared'
    id 'strata-documented'
    // Contract tests every engine adapter runs against its own implementations
    id 'java-test-fixtures'
}

description = 'The Strata SPI: what an engine adapter implements and drives.'

dependencies {
    // compileOnly: loaders compile every shared project's sources themselves, so nothing may leak in transitively
    compileOnly(project(':api'))

    testFixturesApi(project(':api'))
    testFixturesApi(platform("org.junit:junit-bom:${junit_version}"))
    testFixturesApi('org.junit.jupiter:junit-jupiter')

    testImplementation(project(':api'))
}
