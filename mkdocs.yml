site_name: Strata
site_description: An engine-agnostic GUI library for Java games, with a Swing adapter.
site_url: https://inspirenxe.github.io/Strata/
repo_url: https://github.com/InspireNXE/Strata
repo_name: InspireNXE/Strata
edit_uri: edit/main/docs/
copyright: Copyright InspireNXE. Released under the MIT License.

docs_dir: docs
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      # Java examples come from the docs-examples project, which the build compiles and tests
      base_path:
        - docs-examples/src/main/java/org/inspirenxe/strata/examples
        - docs-examples/src/test/java/org/inspirenxe/strata/examples
        - .
      check_paths: true
      dedent_subsections: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: info

# docs/javadoc is copied in by `./gradlew siteJavadoc` and served as static files. Its legal/*.md notices stay
# published but out of the navigation.
exclude_docs: |
  requirements.txt
not_in_nav: |
  /javadoc/

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Your first screen: getting-started/first-screen.md
      - Core concepts: getting-started/concepts.md
  - Guides:
      - guides/index.md
      - Components: guides/components.md
      - Layout: guides/layout.md
      - Controls: guides/controls.md
      - Overlays and tooltips: guides/overlays.md
      - Events: guides/events.md
      - Event snapshots: guides/snapshots.md
      - Input and focus: guides/input-focus.md
      - Screens: guides/screens.md
      - Themes: guides/theming.md
      - Text: guides/text.md
      - Extending Strata: guides/extending.md
  - Platforms:
      - platforms/index.md
      - Swing: platforms/swing.md
      - Platform differences: platforms/differences.md
      - Writing an adapter: platforms/writing-an-adapter.md
  - Reference:
      - reference/index.md
      - Javadoc: reference/javadoc.md
      - Event types: reference/event-types.md
      - Theme keys: reference/theme-keys.md
      - Defaults and timings: reference/defaults.md
      - Keyboard shortcuts: reference/shortcuts.md
  - Help:
      - help/index.md
      - FAQ: help/faq.md
      - Troubleshooting: help/troubleshooting.md
      - Status and limitations: help/status.md
  - Project:
      - project/index.md
      - Design: DESIGN.md
      - Roadmap: ROADMAP.md
      - Contributing: project/contributing.md
