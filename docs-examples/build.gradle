plugins {
    id 'strata-java'
}

description = 'The code shown on the documentation site. Pages include it by section, so every example compiles.'

dependencies {
    // What a mod or game compiles against
    implementation(project(':api'))
    implementation(project(':canvas-swing'))
    // The adapter guide's example engine creates hosts and runs the SPI contract tests
    implementation(project(':spi'))
    implementation(project(':core'))
    testImplementation(testFixtures(project(':spi')))
}

tasks.named('test', Test) {
    systemProperty('java.awt.headless', 'true')
}

// Renders the example screens to the PNGs the pages show
tasks.register('renderDocImages', JavaExec) {
    group = 'documentation'
    description = 'Renders the documentation example screens to docs/assets/images.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.inspirenxe.strata.examples.RenderDocImages'
    args(rootProject.file('docs/assets/images').absolutePath)
    systemProperty('java.awt.headless', 'true')
}
